name = "thebullandbloom"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
# Keep the workers.dev URL alive alongside the custom domains (adding routes turns it off by default).
workers_dev = true

# Production hostnames. A deploy attaches these to the Worker as Custom Domains and replaces the
# zone's existing records for them (the old GitHub Pages CNAMEs). Needs the zone in the same
# Cloudflare account and an API token with Zone DNS edit + Workers Routes edit.
routes = [
  { pattern = "thebullandbloom.com", custom_domain = true },
  { pattern = "www.thebullandbloom.com", custom_domain = true }
]

[assets]
directory = "./site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "bullandbloom"
database_id = "48c896fa-161a-4bca-9a0b-4a111c91c354"
migrations_dir = "migrations"

# Cached Instagram images. Needs R2 enabled on the account; until then the deploy workflow
# strips this block (see .github/workflows/deploy.yml) and the site runs without the strip.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "bullandbloom-media"

[triggers]
crons = ["*/15 * * * *"]

# Secrets (wrangler secret put): STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, ADMIN_PASSCODE, ADMIN_SECRET,
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, INSTAGRAM_APP_ID, INSTAGRAM_APP_SECRET, UBER_CLIENT_ID,
# UBER_CLIENT_SECRET, UBER_CUSTOMER_ID, UBER_WEBHOOK_SECRET. The Google, Instagram and Uber sets are
# optional; without them those features report "not set up" and delivery falls back to the flat-fee
# zip list (spec §4.5).
[vars]
SITE_URL = "https://thebullandbloom.com"
