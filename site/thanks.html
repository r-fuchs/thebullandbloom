<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — The Bull and Bloom</title>
<link rel="icon" href="assets/logo.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=EB+Garamond&display=swap">
<style>
  body{margin:0;background:#F6F0E5;color:#3A2E24;font-family:"EB Garamond",Garamond,Georgia,serif;font-size:1.125rem;line-height:1.6}
  main{max-width:36rem;margin:0 auto;padding:4rem 1.5rem;text-align:center}
  h1{font-family:"Cormorant Garamond",Garamond,serif;font-weight:500;font-size:2.4rem;margin:0 0 1rem}
  a{color:inherit}
</style>
</head>
<body>
<main>
  <h1>Thank you</h1>
  <p id="msg">Your bouquet is on Anthony's list. A receipt is on its way from Stripe, and Anthony will text or email if he has a question.</p>
  <script>
    (function () {
      var q = location.search, msg = document.getElementById('msg');
      var booking = /[?&]booking=([^&]+)/.exec(q), offerId = /[?&]offer=([^&]+)/.exec(q);
      if (/[?&]subscription=1/.test(q)) {
        msg.textContent = "Your subscription is set. Your first bouquet's date, and the link to cancel or change your card, are in the email on its way to you.";
        return;
      }
      if (!booking) return;
      msg.textContent = "Your seat is saved. The details, including where to come, are in the email on its way to you.";
      // D51: the Meta Pixel loads on this page only for a class booking, and only with an id. Nothing here affects the booking.
      fetch('/api/offers').then(function (r) { return r.json(); }).then(function (data) {
        var id = data.marketing && data.marketing.metaPixelId;
        var offer = offerId ? (data.offers || []).filter(function (o) { return o.id === decodeURIComponent(offerId[1]); })[0] : null;
        if (!id || !offer || window.fbq) return;
        !function (f, b, e, v, n, t, s) { if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); }; if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = []; t = b.createElement(e); t.async = !0; t.src = v; s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s); }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
        window.fbq('init', id);
        window.fbq('track', 'PageView');
        window.fbq('track', 'Purchase', { value: offer.priceCents / 100, currency: 'USD' });
      }).catch(function () {});
    })();
  </script>
  <p>Questions? <a href="mailto:thebullandbloom@gmail.com">thebullandbloom@gmail.com</a> · <a href="tel:+15183340517">(518) 334-0517</a></p>
  <p><a href="/">Back to the site</a></p>
</main>
</body>
</html>
