# Deploys the Worker (src/ + site/) to Cloudflare from GitHub, so a deploy no longer needs Ryan's Mac.
#
# Two ways it runs:
#   - Manually (Actions → Deploy → Run workflow) from any branch, with the site URL the Worker should
#     use for Stripe and Google redirects. Default is the preview workers.dev URL, the state we ship
#     to until DNS cutover.
#   - Automatically on a push to `main`, using the production SITE_URL from wrangler.toml. Only merge
#     the store to main when DNS is ready to move (spec §4.7).
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare Workers" template, plus D1 edit
#   CLOUDFLARE_ACCOUNT_ID  from the Workers overview page in the Cloudflare dashboard
# Worker secrets (Stripe, admin, Google) already live in Cloudflare and are untouched by a deploy.
# Optional: INSTAGRAM_APP_ID and INSTAGRAM_APP_SECRET as repository secrets are uploaded to the
# Worker on each deploy (so the Instagram app keys never need a laptop either).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "SITE_URL the Worker should redirect back to"
        required: true
        default: "https://thebullandbloom.thebullandbloom.workers.dev"
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Ensure the media bucket exists (or deploy without it until R2 is enabled)
        id: r2
        run: |
          if npx wrangler r2 bucket list 2>/dev/null | grep -q "bullandbloom-media" || npx wrangler r2 bucket create bullandbloom-media; then
            echo "config=wrangler.toml" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::R2 is not enabled on this Cloudflare account yet (Dashboard → R2 → enable). Deploying without the media bucket; Instagram stays 'not set up'."
            awk 'BEGIN{skip=0} /^\[\[r2_buckets\]\]/{skip=1; next} skip && /^\[/{skip=0} !skip{print}' wrangler.toml > wrangler.ci.toml
            echo "config=wrangler.ci.toml" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Instagram app keys when set
        env:
          IG_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          IG_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
        run: |
          if [ -n "$IG_ID" ] && [ -n "$IG_SECRET" ]; then
            printf '%s' "$IG_ID" | npx wrangler secret put INSTAGRAM_APP_ID
            printf '%s' "$IG_SECRET" | npx wrangler secret put INSTAGRAM_APP_SECRET
          else
            echo "no Instagram app keys in repository secrets; skipping"
          fi
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply bullandbloom --remote --config "${{ steps.r2.outputs.config }}"
      - name: Deploy
        run: |
          CFG="${{ steps.r2.outputs.config }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npx wrangler deploy --config "$CFG" --var "SITE_URL:${{ github.event.inputs.site_url }}"
          else
            npx wrangler deploy --config "$CFG"
          fi
      - name: Check the deployed Worker
        run: |
          URL="${{ github.event.inputs.site_url || 'https://thebullandbloom.com' }}"
          curl -sSf "$URL/api/health"
