# Deploys the Worker (src/ + site/) to Cloudflare from GitHub, so a deploy no longer needs Ryan's Mac.
#
# Two ways it runs:
#   - Manually (Actions → Deploy → Run workflow) from any branch, with the site URL the Worker should
#     use for Stripe and Google redirects. Default is the preview workers.dev URL, the state we ship
#     to until DNS cutover.
#   - Automatically on a push to `main`, using the production SITE_URL from wrangler.toml. Only merge
#     the store to main when DNS is ready to move (spec §4.7).
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare Workers" template, plus D1 edit
#   CLOUDFLARE_ACCOUNT_ID  from the Workers overview page in the Cloudflare dashboard
# Worker secrets already live in Cloudflare and are untouched by a deploy: STRIPE_SECRET_KEY,
# STRIPE_WEBHOOK_SECRET, ADMIN_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# UBER_CLIENT_ID, UBER_CLIENT_SECRET, UBER_CUSTOMER_ID and UBER_WEBHOOK_SECRET.
# Optional: INSTAGRAM_APP_ID and INSTAGRAM_APP_SECRET as repository secrets are uploaded to the
# Worker on each deploy (so the Instagram app keys never need a laptop either).
# Cutover: on a push to main, UBER_PROD_CLIENT_ID / UBER_PROD_CLIENT_SECRET / UBER_PROD_CUSTOMER_ID /
# UBER_PROD_WEBHOOK_SECRET and STRIPE_LIVE_SECRET_KEY / STRIPE_LIVE_WEBHOOK_SECRET replace the test
# keys on the Worker. Manual preview deploys never touch them.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "SITE_URL the Worker should redirect back to"
        required: true
        default: "https://thebullandbloom.thebullandbloom.workers.dev"
      uber_robocourier:
        description: "Set to 1 to run sandbox deliveries with Robocourier; leave empty for real couriers"
        required: false
        default: ""
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Ensure the media bucket exists (or deploy without it until R2 is enabled)
        id: r2
        run: |
          if npx wrangler r2 bucket list 2>/dev/null | grep -q "bullandbloom-media" || npx wrangler r2 bucket create bullandbloom-media; then
            echo "config=wrangler.toml" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::R2 is not enabled on this Cloudflare account yet (Dashboard → R2 → enable). Deploying without the media bucket; Instagram stays 'not set up'."
            awk 'BEGIN{skip=0} /^\[\[r2_buckets\]\]/{skip=1; next} skip && /^\[/{skip=0} !skip{print}' wrangler.toml > wrangler.ci.toml
            echo "config=wrangler.ci.toml" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Instagram app keys when set
        env:
          IG_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          IG_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
        run: |
          if [ -n "$IG_ID" ] && [ -n "$IG_SECRET" ]; then
            printf '%s' "$IG_ID" | npx wrangler secret put INSTAGRAM_APP_ID
            printf '%s' "$IG_SECRET" | npx wrangler secret put INSTAGRAM_APP_SECRET
          else
            echo "no Instagram app keys in repository secrets; skipping"
          fi
      - name: Production keys on a push to main (Uber and Stripe live)
        # The Worker carries TEST keys until cutover. A push to main is the cutover, so it swaps in the
        # production keys from repository secrets; a manual preview deploy never does. Any key that is
        # not set is left alone, so a partial set of secrets cannot half-configure the Worker.
        if: github.event_name == 'push'
        env:
          U_ID: ${{ secrets.UBER_PROD_CLIENT_ID }}
          U_SECRET: ${{ secrets.UBER_PROD_CLIENT_SECRET }}
          U_CUSTOMER: ${{ secrets.UBER_PROD_CUSTOMER_ID }}
          U_WEBHOOK: ${{ secrets.UBER_PROD_WEBHOOK_SECRET }}
          S_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
          S_WEBHOOK: ${{ secrets.STRIPE_LIVE_WEBHOOK_SECRET }}
        run: |
          if [ -n "$U_ID" ] && [ -n "$U_SECRET" ] && [ -n "$U_CUSTOMER" ] && [ -n "$U_WEBHOOK" ]; then
            printf '%s' "$U_ID" | npx wrangler secret put UBER_CLIENT_ID
            printf '%s' "$U_SECRET" | npx wrangler secret put UBER_CLIENT_SECRET
            printf '%s' "$U_CUSTOMER" | npx wrangler secret put UBER_CUSTOMER_ID
            printf '%s' "$U_WEBHOOK" | npx wrangler secret put UBER_WEBHOOK_SECRET
          else
            echo "::warning::UBER_PROD_* repository secrets incomplete; Worker keeps its current Uber keys"
          fi
          if [ -n "$S_KEY" ] && [ -n "$S_WEBHOOK" ]; then
            printf '%s' "$S_KEY" | npx wrangler secret put STRIPE_SECRET_KEY
            printf '%s' "$S_WEBHOOK" | npx wrangler secret put STRIPE_WEBHOOK_SECRET
          else
            echo "::warning::STRIPE_LIVE_* repository secrets not set; Worker keeps its current Stripe keys"
          fi
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply bullandbloom --remote --config "${{ steps.r2.outputs.config }}"
      - name: Deploy
        run: |
          CFG="${{ steps.r2.outputs.config }}"
          ROBO="${{ github.event.inputs.uber_robocourier }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$ROBO" ]; then
              npx wrangler deploy --config "$CFG" --var "SITE_URL:${{ github.event.inputs.site_url }}" --var "UBER_ROBOCOURIER:$ROBO"
            else
              npx wrangler deploy --config "$CFG" --var "SITE_URL:${{ github.event.inputs.site_url }}"
            fi
          else
            npx wrangler deploy --config "$CFG"
          fi
      - name: Check the deployed Worker
        run: |
          URL="${{ github.event.inputs.site_url || 'https://thebullandbloom.com' }}"
          curl -sSf "$URL/api/health"
